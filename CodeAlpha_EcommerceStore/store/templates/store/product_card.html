<article class="card">
  <div class="wish">
    {% if user.is_authenticated %}
      <form method="post" action="{% url 'wishlist_toggle' p.id %}" class="js-wish">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ request.get_full_path }}">
        <button type="submit" class="wish-btn{% if p.id in wishlist_ids %} on{% endif %}" aria-label="Add to wishlist"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg></button>
      </form>
    {% else %}
      <a class="wish-btn" href="{% url 'login' %}?next={{ request.get_full_path|urlencode }}" aria-label="Log in to save to wishlist"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg></a>
    {% endif %}
  </div>
  <a href="{{ p.get_absolute_url }}" class="thumb">
    {% if p.picture %}<img src="{{ p.picture }}" alt="{{ p.name }}" loading="lazy">{% else %}<div class="noimg">No image</div>{% endif %}
  </a>
  <div class="card-body">
    <span class="cat">{{ p.category.icon }} {{ p.category.name }}</span>
    <h2><a href="{{ p.get_absolute_url }}">{{ p.name }}</a></h2>
    <div class="price-row">
      <strong class="price">₹{{ p.price }}</strong>
      {% if p.stock == 0 %}
        <span class="oos">Out of stock</span>
      {% else %}
        <form method="post" action="{% url 'cart_add' p.id %}" class="js-add">
          {% csrf_token %}
          <input type="hidden" name="quantity" value="1">
          <input type="hidden" name="next" value="{{ request.get_full_path }}">
          <button type="submit" class="btn small">Add to cart</button>
        </form>
      {% endif %}
    </div>
  </div>
</article>
