{% extends "social/base.html" %}
{% block title %}Change password · Circle{% endblock %}
{% block content %}
<div class="narrow">
  <a class="back" href="{% url 'edit_profile' %}"><svg width="20" height="20" class="icon"><use href="#i-back"/></svg>Settings</a>
  <form class="card form" method="post">
    <h2>Change password</h2>
    {% csrf_token %}
    <label>Current password {{ form.old_password }}</label>
    <label>New password {{ form.new_password1 }}</label>
    <label>Confirm new password {{ form.new_password2 }}</label>
    {% if form.errors %}<div class="error">{% for field in form %}{% for e in field.errors %}<div>{{ e }}</div>{% endfor %}{% endfor %}</div>{% endif %}
    <button class="btn">Update password</button>
  </form>
</div>
{% endblock %}
