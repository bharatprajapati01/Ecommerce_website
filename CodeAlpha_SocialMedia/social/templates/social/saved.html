{% extends "social/base.html" %}
{% block title %}Saved · Circle{% endblock %}
{% block content %}
<div class="narrow">
  <h2 class="page-title">Saved posts</h2>
  {% for post in posts %}
    {% include "social/_post.html" %}
  {% empty %}
    <div class="card empty"><strong>Nothing saved yet</strong>Tap the bookmark on any post to keep it here.</div>
  {% endfor %}
</div>
{% endblock %}
