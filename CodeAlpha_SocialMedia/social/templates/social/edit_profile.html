{% extends "social/base.html" %}
{% block title %}Edit profile · Circle{% endblock %}
{% block content %}
<div class="narrow">
  <a class="back" href="{% url 'profile' user.username %}"><svg width="20" height="20" class="icon"><use href="#i-back"/></svg>Back to profile</a>
  <form class="card form" method="post" enctype="multipart/form-data">
    <h2>Edit profile</h2>
    {% csrf_token %}
    <label>Bio {{ form.bio }}</label>
    <label>Avatar {{ form.avatar }}</label>
    {{ form.errors }}
    <button class="btn">Save changes</button>
    <a class="btn ghost" href="{% url 'password_change' %}"><svg width="20" height="20" class="icon"><use href="#i-lock"/></svg>Change password</a>
  </form>
</div>
{% endblock %}
